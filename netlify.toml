[dev]
  command = "npm run dev"
  framework = "astro"
  targetPort = 4321
  port = 8888

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions/"

[build.environment]
  NODE_VERSION = "24"


# 🔒 Bloqueo perimetral estricto del worker de notificaciones (solo invocable por el cron interno de Netlify)
[[redirects]]
  from = "/api/notificaciones-worker*"
  to = "/404"
  status = 404
  force = true

# ✅ Redirecciones del Sistema de Citas y API Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/reservar"
  to = "/reservar"
  status = 200

[[redirects]]
  from = "/gestionar-cita"
  to = "/gestionar-cita"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# ✅ Permitir la página de mantenimiento
[[redirects]]
  from = "/mantenimiento"
  to = "/mantenimiento"
  status = 200

